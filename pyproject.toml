[project]
name = "nlp-assignments"
version = "0.1.0"
description = "KU AIAC 536 - Natural Language Processing coursework (MTech AI, Sem II)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

# Installed per-assignment so we never pull ~2 GB of torch just to do POS tagging.
#   uv sync --group dev --group nlp     -> a1 (POS), a2 (NER)
#   uv sync --group dev --group embed   -> a3
#   uv sync --group dev --group deep    -> a3-p5, a4
[dependency-groups]
nlp = ["spacy>=3.8", "nltk>=3.9", "en-core-web-sm", "en-core-web-md"]
embed = ["scikit-learn>=1.5", "matplotlib>=3.9", "gensim>=4.3"]
deep = ["torch>=2.4", "transformers>=4.44"]
dev = ["jupyterlab>=4.2", "ipykernel>=6.29", "ruff>=0.6"]

[tool.uv]
package = false          # this is a coursework repo, not a library

# Pin the spaCy model so `uv sync` cannot prune it (a plain
# `spacy download` is not in the lockfile and gets removed).
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }          # this is a coursework repo, not a library

[tool.ruff]
line-length = 100
